<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>排行榜 V1.3 · 预测评分 · 150 场 · 含实力榜 · 赛事预言家</title>
<style>
:root {
  /* ==========================================================================
     1. Primitive — 物理值
     ========================================================================== */

  /* 1.1 绿系（品牌） */
  --green-100: #d5ead4;   /* 页面最底 canvas */
  --green-300: #9ee48a;   /* 品牌 mark 渐变起点 / CTA 渐变起点 */
  --green-400: #7ed56f;   /* 品牌主色 */
  --green-500: #62c453;   /* mark/CTA 渐变终点 */
  --green-700: #2f8a3a;   /* 主色按下态 */
  --green-800: #1a5c26;   /* 正向分数文字（背景图上实测 5.0:1） */
  --green-900: #163024;   /* 主文字 */

  /* 1.2 薄荷（品牌浅面） */
  --mint-50: #f4fbf0;     /* 实色面渐变起点 */
  --mint-100: #e8f8df;    /* 品牌软底 / 实色面渐变终点 */
  --mint-300: #dcead9;    /* 细边框 */

  /* 1.3 青（成功 / 锁定） */
  --teal-50: #e8fbf8;     /* 命中提示底 */
  --teal-500: #3aa37a;    /* 已提交 / 提交成功 */
  --teal-700: #0b7f70;    /* 已锁定 */

  /* 1.4 橙（进行中） */
  --orange-50: #fff1e8;   /* 进行中标签底 */
  --orange-500: #f08a3c;  /* 进行中 */

  /* 1.5 红 / 蓝 / 中性 */
  --red-500: #c05621;     /* 错误文字 */
  --navy-700: #1a2b44;    /* 深色比分块渐变起点 */
  --navy-900: #122033;    /* 深色比分块渐变终点 / 描边 */
  --slate-200: #f3f6fb;   /* 中性标签底 */
  --neutral-700: #718096; /* 完场 */
  --white: #ffffff;

  /* 1.6 文字专用深档（母版页在球场照片上实测 5.0–7.9:1；
         旧的 #5b7166 / #86a092 只有 1.1–4.7:1，已废弃） */
  --ink-700: #3b4f43;     /* 次级文字 */
  --ink-600: #42564a;     /* 弱文字 */

  /* 1.7 半透明白（玻璃 / 描边 / 内高光用）—— 只收录真实在用的档位 */
  --alpha-white-45: rgba(255, 255, 255, 0.45);
  --alpha-white-48: rgba(255, 255, 255, 0.48);
  --alpha-white-50: rgba(255, 255, 255, 0.50);
  --alpha-white-54: rgba(255, 255, 255, 0.54);
  --alpha-white-58: rgba(255, 255, 255, 0.58);
  --alpha-white-60: rgba(255, 255, 255, 0.60);
  --alpha-white-66: rgba(255, 255, 255, 0.66);
  --alpha-white-72: rgba(255, 255, 255, 0.72);
  --alpha-white-82: rgba(255, 255, 255, 0.82);
  --alpha-white-88: rgba(255, 255, 255, 0.88);

  /* 1.8 字体族（小程序不加载外部字体；数字族缺字时回落系统无衬线） */
  --font-family-cn: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-family-number: "Outfit", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;

  /* 1.9 字号（rpx，0.5px = 0.5px @375） */
  --font-18: 9px;
  --font-20: 10px;
  --font-22: 11px;
  --font-24: 12px;
  --font-26: 13px;
  --font-30: 15px;
  --font-32: 16px;
  --font-36: 18px;

  /* 1.10 字重 */
  --weight-regular: 400;
  --weight-medium: 600;
  --weight-semibold: 650;
  --weight-bold: 700;
  --weight-heavy: 750;

  /* 1.11 间距（rpx）—— 只收录首页真实出现的档位 */
  --space-1: 2px;
  --space-2: 4px;
  --space-3: 6px;
  --space-4: 8px;
  --space-5: 10px;
  --space-6: 12px;
  --space-7: 14px;
  --space-8: 16px;
  --space-9: 18px;
  --space-10: 20px;

  /* 1.12 圆角 */
  --radius-xs: 8px;     /* 状态标签 / 步进按钮 */
  --radius-sm: 9px;     /* 次级按钮 */
  --radius-md: 10px;     /* CTA / 品牌 mark */
  --radius-lg: 12px;     /* 预测编辑区 */
  --radius-xl: 14px;     /* 比分块 / 日期格 */
  --radius-card: 16px;   /* 比赛卡 */
  --radius-tray: 20px;   /* 联赛托盘 */
  --radius-pill: 49.5px;   /* 选中下划线 */

  /* 1.13 动效（V1 定格值：180 / 240 / 320ms。
         旧 token 的 120 / 220ms 与首页实装不符，已废弃） */
  --duration-shift: 180ms;    /* 列表切换（退场） */
  --duration-enter: 240ms;    /* 列表切换（入场） */
  --duration-predict: 320ms;  /* 预测区展开 / 提交成功 */
  --ease-standard: ease;
  --ease-emphasized: cubic-bezier(0.4, 0, 0.2, 1);
  /* 注：@keyframes 里的 4px 位移刻意保留字面量 —— var() 在关键帧中的中间态
     无法被 computed 快照回归覆盖，抽象化只会换来「测不到的改动」。 */

  /* 1.14 模糊 */
  --blur-card: 18px;
  --blur-tray: 7px;

  /* 1.15 描边宽度 */
  --border-hairline: 1px;    /* = 1px @375 */

  /* ==========================================================================
     2. Semantic — 用途语义
     ========================================================================== */

  /* 2.1 文字 */
  --text-primary: var(--green-900);
  --text-secondary: var(--ink-700);
  --text-muted: var(--ink-600);
  --text-on-brand: var(--green-900);      /* 绿底按钮上的文字 */
  --text-positive: var(--green-800);      /* 最近成绩 +K */
  --text-danger: var(--red-500);

  /* 2.2 品牌 */
  --color-brand-primary: var(--green-400);
  --color-brand-primary-pressed: var(--green-700);
  --color-brand-soft: var(--mint-100);

  /* 2.3 状态 */
  --color-state-live: var(--orange-500);
  --color-state-live-soft: var(--orange-50);
  --color-state-done: var(--neutral-700);
  --color-state-done-soft: var(--slate-200);
  --color-state-success: var(--teal-500);
  --color-state-locked: var(--teal-700);
  --color-state-hit-soft: var(--teal-50);

  /* 2.4 Surface（首页玻璃档位：白底负责可读性，blur 负责观感） */
  --surface-canvas: var(--green-100);                       /* 最底画布 */
  --surface-page: radial-gradient(120% 56% at 92% -8%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 46%), radial-gradient(80% 40% at 0% 18%, rgba(126,213,111,0.22) 0%, rgba(126,213,111,0) 55%), linear-gradient(180deg, #f4fbf1 0%, #eef8ef 42%, #f3faf2 100%);
                                                            /* 兜底底色：正常被球场照片盖住 */
  --surface-card: var(--alpha-white-54);                    /* 比赛卡 */
  --surface-card-strong: var(--alpha-white-58);             /* 可预测卡 */
  --surface-pred: var(--alpha-white-50);                    /* 卡内预测编辑区 */
  --surface-tray: var(--alpha-white-48);                    /* 联赛托盘 */
  --surface-ghost: var(--alpha-white-72);                   /* 次级按钮（更多 / 重试） */
  --surface-date-active: var(--white);                      /* 日期选中态：实心白 */
  --surface-solid: linear-gradient(180deg, var(--mint-50), var(--mint-100));   /* 比分块：实色，不参与玻璃化 */
  --surface-solid-dark: linear-gradient(180deg, var(--navy-700), var(--navy-900));

  /* 2.5 边框 */
  --border-subtle: var(--mint-300);
  --border-glass-strong: var(--alpha-white-88);             /* 卡面描边 */
  --border-glass: var(--alpha-white-82);                    /* 托盘描边 */
  --border-pred: var(--alpha-white-66);                     /* 预测编辑区描边 */
  --border-dark: var(--navy-900);

  /* 2.6 阴影 */
  --shadow-card: 0 12px 30px rgba(23, 60, 35, 0.10), inset 0 1px 0 var(--alpha-white-60);
  --shadow-floating: 0 8px 16px rgba(63, 138, 72, 0.22), inset 0 1px 0 var(--alpha-white-45);
  --shadow-sm: 0 4px 10px rgba(63, 138, 72, 0.05);
  --shadow-tray: inset 0 1px 0 var(--alpha-white-82), 0 6px 16px rgba(47, 106, 62, 0.05);  /* 内高光 = --border-glass 同值，直接用 primitive */
  --shadow-mark: 0 8px 16px rgba(63, 138, 72, 0.28), inset 0 1px 0 var(--alpha-white-45);
  --shadow-bug: 0 2px 6px rgba(31, 84, 45, 0.08);

  /* ==========================================================================
     3. Component — 组件规范（只在组件有明确独立规范时建立）
     ========================================================================== */

  /* 3.1 页面骨架 */
  --page-padding-inline: var(--space-8);                                     /* 16px */
  --page-padding-bottom: calc(34px + env(safe-area-inset-bottom));          /* 让开 tabBar */
  --topbar-offset: 40px;                                                     /* 顶栏距安全区顶 */
  --topbar-height: 44px;
  --home-spacer-top: 76px;                                                   /* 顶栏占位（含 8px 叠压余量） */
  --home-tray-offset: var(--space-5);                                        /* 联赛托盘上间距 10px */

  /* 3.2 品牌 mark */
  --mark-size: 32px;
  --mark-radius: var(--radius-md);
  --mark-ball-size: 18px;
  --mark-gradient: linear-gradient(160deg, #9ee48a 0%, #4caf50 100%);

  /* 3.3 联赛托盘 */
  --tray-radius: var(--radius-tray);
  --tray-min-height: 56px;
  --tray-cell-width: 52px;
  --tray-cell-height: 46px;
  --tray-logo-size: 28px;

  /* 3.4 日期条 */
  --date-width: 56px;
  --date-height: 48px;
  --date-radius: var(--radius-xl);

  /* 3.5 比赛卡 */
  --match-card-radius: var(--radius-card);
  --match-card-background: var(--surface-card);
  --match-card-background-strong: var(--surface-card-strong);
  --match-card-border: var(--border-hairline) solid var(--border-glass-strong);
  --match-card-shadow: var(--shadow-card);
  --match-card-blur: var(--blur-card);
  --match-card-gap: var(--space-5);                       /* 卡间距 10px */
  --match-card-padding: 12px 12px 12px 14px;
  --match-card-bar-width: 3px;                           /* 左侧状态竖条 */
  --crest-size: 36px;

  /* 3.6 比分块（vs 框）—— 必须实色，不得玻璃化 */
  --bug-size: 56px;
  --bug-radius: var(--radius-xl);

  /* 3.7 预测编辑区 */
  --pred-radius: var(--radius-lg);
  --pred-background: var(--surface-pred);
  --pred-border: var(--border-hairline) solid var(--border-pred);
  --pred-max-height: 260px;
  --stepper-button-size: 28px;
  --stepper-team-logo-size: 20px;
  --stepper-value-width: 20px;

  /* 3.8 按钮
         交互命中区与视觉高度是两件事：这里是**视觉高度**，
         命中区规则见文档「Accessibility」（不强制把视觉高度抬到 44px）。 */
  --cta-background: linear-gradient(180deg, var(--green-300), var(--green-500));
  --cta-height: 36px;
  --submit-button-height: 34px;
  --ghost-button-height: 32px;
  --status-chip-height: 20px;

  /* 3.9 tabBar
         微信 tabBar 由 app.json 配置、原生渲染，当前项目未做任何样式配置，
         因此 V1 没有可提炼的 tabBar token（见文档 "tabBar" 一节）。 */
}

function entries(){return Array.from({length:state.scope==='group'&&state.group==='mine'?12:20},(_,index)=>{
 const position=index+1;

 const exact=state.board==='week'?Math.max(1,7-Math.floor(index/3)):state.board==='season'?Math.max(3,18-Math.floor(index/2)):Math.max(12,52-index);
 const hits=isMe?config[state.board].hits:Math.min(exact,Math.floor(points/12));
 const baseCount=state.board==='week'?13:state.board==='season'?100+index*2:state.board==='career'?240+index*3:180+index;
 const count=state.board==='strength'?baseCount:Math.max(baseCount,hits+(points-12*hits)/3+6);
 const target=state.scope==='group'?2.2842+(mePosition-position)*.035:3.1-index*.045;
 const sum=state.board==='strength'?Math.floor((target*(count+40)-68)/3)*3:null;
 return {position,name,isMe,avatar:isMe?rankingIdentity.avatar:(index%3===0?null:demoPortrait(index)),wechatAvatar:isMe?rankingIdentity.wechatAvatar:demoPortrait(index+1),team:isMe?'阿森纳':teams[index%teams.length],level:isMe?4:6-Math.min(3,Math.floor(index/5)),n:isMe?config[state.board].n:count,hits,value:isMe?config[state.board].value:state.board==='strength'?strengthValue(sum,count):String(points),sum:isMe?366:sum,id:isMe?'102846':String(102701+index)};
 });}

function render(){const board=config[state.board];const data=entries();const total=state.scope==='group'?groups[state.group].total:1286;const date=state.period==='previous'?'09.21 — 09.27':'09.28 — 10.04';const social=variant===2;const compact=variant===3;
 app.innerHTML='<div class="page-heading"><div><div class="eyebrow">'+(social?'BETTER TOGETHER':compact?'THE LEADERBOARD':'PREDICTION LEAGUE')+'</div><h1>'+(social?'同场，更懂球。':compact?'排行榜':'排行榜')+'</h1><p>'+(social?'和熟悉的人，较量足球理解。':compact?'只看表现，让数据说话。':'让每一次判断，都有回响。')+'</p></div><button class="rule-button" data-action="rules" aria-label="查看排行榜规则">?</button></div><div class="scope-switch" role="tablist" aria-label="榜单范围"><button role="tab" data-scope="global" aria-selected="'+(state.scope==='global')+'">全站排行榜</button><button role="tab" data-scope="group" aria-selected="'+(state.scope==='group')+'">我的预言群</button></div>'+(state.scope==='group'?'<div class="card group-picker"><label for="group-select">当前群 · 独立排名</label><select id="group-select">'+Object.entries(groups).map(([key,group])=>'<option value="'+key+'" '+(state.group===key?'selected':'')+'>'+group.name+' · '+group.count+' 人</option>').join('')+'</select></div>':'')+'<div class="board-tabs" role="tablist" aria-label="排行榜类型">'+Object.entries({week:'本周',season:'赛季',strength:'实力',career:'生涯'}).filter(([key])=>key!=='strength'||strengthWindowCount>=50).map(([key,name])=>'<button role="tab" data-board="'+key+'" aria-selected="'+(state.board===key)+'">'+name+'榜'+(key==='season'?'<small>设计扩展</small>':'')+'</button>').join('')+'</div><div class="board-meta"><span>'+(state.board==='week'?'2026 · '+date:state.board==='season'?'2026/27 等级赛季':state.board==='strength'?'窗口 50–300 场':'永久累计')+'</span>'+(state.board==='week'?'<select id="period-select" aria-label="选择自然周"><option value="current" '+(state.period==='current'?'selected':'')+'>本周 · 09.28—10.04</option><option value="previous" '+(state.period==='previous'?'selected':'')+'>上周 · 09.21—09.27</option></select>':'<span>'+(state.board==='strength'?'截止':'快照')+' 09.30 10:00</span>')+'</div><section class="card hero"><div class="field-art" aria-hidden="true"></div><div class="hero-top"><span class="eyebrow">'+(state.scope==='group'?'YOUR INNER CIRCLE':'THE '+state.board.toUpperCase()+' BOARD')+'</span><span class="hero-stamp">'+(state.board==='week'?(state.period==='previous'?'历史周 · 已封榜':'本周进行中'):state.board==='season'?'探索 · 非 MVP 接口':'已更新快照')+'</span></div><h2>'+board.title+'</h2><p>'+board.subtitle+'</p><div class="hero-metrics"><div><b class="num">'+total.toLocaleString()+'</b><small>'+(state.scope==='group'?'群内入榜人数':'全站入榜人数')+'</small></div><div><b class="num">'+(state.board==='strength'?'50':'20')+'</b><small>'+(state.board==='strength'?'场有效预测入榜':'名公开榜单')+'</small></div><div><b class="num">'+(state.board==='week'?'01':state.board==='strength'?(state.example==='ranked'?'2.28':'—'):'∞')+'</b><small>'+(state.board==='week'?'场有效预测起':state.board==='strength'?'我的预测评分':'积分持续积累')+'</small></div></div></section>'+(state.board==='season'?'<div class="summary-note extension"><b>赛季榜 · 需求扩展</b><br>MVP §19 仅定义 week / career / strength。此稿以 §16 本赛季统计探索累计积分榜，不对应已有 board 接口，也不是联赛赛季榜。</div>':'')+(social?'<div class="social-callout"><div class="social-icon" aria-hidden="true">⚑</div><div><b>'+(state.scope==='group'?groups[state.group].name:'找到你的看球搭子')+'</b><p>'+(state.scope==='group'?'熟悉的人，同样的计分规则。':'切到群榜，看看谁是群里的预言家。')+'</p></div><button data-action="social" aria-label="查看我的群">→</button></div>':'')+(!compact?'<div class="podium" aria-label="榜单前三名">'+podiumPerson(data[1],false)+podiumPerson(data[0],true)+podiumPerson(data[2],false)+'</div>':'')+'<div class="list-heading"><h2>'+(compact?'榜单 · Top 20':'实力见真章')+'</h2><small>按'+board.metric+'排序</small></div><section class="card rank-list" aria-label="排行榜前二十名"><div class="rank-columns"><span>名次</span><span>预言者 / 样本</span><span>'+board.metric+'</span></div>'+data.slice(0,state.page*10).map(row).join('')+'</section>'+(state.page===1&&data.length>10?'<button class="load-more" data-action="more">查看第 11—'+Math.min(20,data.length)+' 名 ↓</button>':'<p class="board-footer">已展示全部公开名次 · 最多前 20 名</p>')+'<div class="card preview-state"><label for="example-select">设计验收 · 我的状态</label><select id="example-select"><option value="ranked" '+(state.example==='ranked'?'selected':'')+'>已入榜</option><option value="empty" '+(state.example==='empty'?'selected':'')+'>未上榜 · 无有效预测</option>'+(state.board==='strength'?'<option value="threshold" '+(state.example==='threshold'?'selected':'')+'>未达门槛 · 窗口 38 场</option>':'')+'</select></div><p class="board-footer">更新时间：2026.09.30 10:00 · 北京时间<br>全部为演示数据 · 非实时比赛 / 排名<br>无月榜 · 公开头像、队徽为本地内嵌示意</p>';
 renderMe();
 enhancePersonalView();
}
function renderMe(){const board=config[state.board];const empty=state.example==='empty';const threshold=state.example==='threshold';const ranked=!empty&&!threshold;const rank=state.scope==='group'?(state.group==='zhang'?3:2):{week:231,season:154,career:116,strength:109}[state.board];const total=state.scope==='group'?groups[state.group].total:1286;const label=ranked?(rank<=20?'第 '+rank+' 名':'前 '+percentile(rank,total)+'%'):'未上榜';const count=empty?0:threshold?38:board.n;const value=empty?(state.board==='strength'?'—':'0'):threshold?'—':board.value;
 document.querySelector('#my-rank').innerHTML='<div class="my-dock-top"><img src="'+myAvatar()+'" alt="我的头像"><div class="my-copy"><b>徐sir <span class="level">Lv.4</span></b><small>我的'+board.name+' · '+(state.scope==='group'?'群内':'全站')+(state.board==='season'?' · 设计扩展':'')+'</small></div><div class="my-rank"><b class="num">'+label+'</b><small>'+(empty?(state.board==='strength'?'再完成 50 场有效预测':'完成首场有效预测后入榜'):threshold?'再完成 12 场有效预测':rank<=20?'绝对名次':'仅展示前百分比')+'</small></div></div><div class="my-dock-bottom"><span>'+board.metric+' <b class="num">'+value+'</b></span><span>'+(state.board==='strength'?'窗口':'有效')+' <b class="num">'+count+'</b> 场</span><span>精确命中 <b class="num">'+(empty?0:threshold?2:board.hits)+'</b> 次</span></div>';
}
function openModal(title,html){modal.querySelector('h2').textContent=title;modal.querySelector('.dialog-body').innerHTML=html;if(!modal.open)modal.showModal();}
let toastTimer;
function notify(text){const toast=document.querySelector('.toast');toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2200);}
function rules(){openModal('排行榜规则','<h3>本周榜</h3><p>按本周已结算预测的积分排名。至少完成 1 场有效预测并结算后参与排名。</p><h3>赛季榜 / 生涯榜</h3><p>赛季榜累计当前赛季积分，生涯榜累计全部历史积分。</p><h3>实力榜</h3><p>根据近期已结算的预测成绩计算预测评分，猜中精确比分加分更多。同时考虑预测场次，减少少量预测带来的偶然波动。分数越高，近期预测表现越好。</p><p>取最近两年内最多 300 场有效预测，满 50 场参与实力榜。</p><button class="score-text-button" data-action="score-info">了解预测评分</button><h3>名次与范围</h3><p>公开榜单展示前 20 名。我的概览显示前百分比及具体排名；群榜在本群成员中独立排名。</p><h3>计分</h3><p>猜中精确比分得 12 分，仅猜中胜平负得 3 分，未命中得 0 分。</p><p class="score-range">此页为静态示例，历史周使用相同示例数据。</p><button class="primary" data-close>知道了</button>');}
document.addEventListener('click',event=>{
const button=event.target.closest('button');if(!button)return;
if(button.hasAttribute('data-close')){modal.close();return;}
if(button.dataset.board){state.board=button.dataset.board;state.page=1;if(state.example==='threshold'&&state.board!=='strength')state.example='ranked';render();return;}
if(button.dataset.scope){state.scope=button.dataset.scope;state.page=1;render();return;}
if(button.dataset.person){const person=entries().find(item=>item.position===Number(button.dataset.person));openModal('公开成长档案','<div class="profile-preview"><img src="'+personAvatar(person)+'" alt="'+esc(person.name)+'的头像"><div><h3>'+esc(person.name)+' · Lv.'+person.level+'</h3><p>ID '+person.id+' · 主队 '+person.team+'</p></div></div><div class="profile-stats"><div><b>'+person.value+'</b><small>'+config[state.board].metric+'</small></div><div><b>'+person.n+'</b><small>'+(state.board==='strength'?'窗口有效场次':'有效场次')+'</small></div><div><b>'+person.hits+'</b><small>精确命中</small></div></div><p>仅展示公开统计。不展示他人未过截止时间的预测内容。</p><p>示例档案 · 非真实用户信息</p><button class="primary" data-close>返回排行榜</button>');return;}
if(button.dataset.action==='score-info'){scoreInfo();return;}
if(button.dataset.action==='score-details'){scoreDetails();return;}
if(button.dataset.action==='rules')rules();


if(button.dataset.action==='more'){state.page=2;render();notify('已展开第 11—20 名');}
if(button.dataset.action==='social'){state.scope='group';state.page=1;render();}
if(button.dataset.action==='matches')notify('独立设计稿 · 比赛页不在本次交付范围');
});
document.addEventListener('change',event=>{if(event.target.id==='group-select'){state.group=event.target.value;state.page=1;render();}if(event.target.id==='period-select'){state.period=event.target.value;state.page=1;render();notify('历史周为相同数据布局演示');}if(event.target.id==='example-select'){state.example=event.target.value;render();}});
modal.addEventListener('click',event=>{if(event.target===modal){const rect=modal.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)modal.close();}});


function scoreInfo(){
 openModal('预测评分','<p>根据近期已结算的预测成绩计算，猜中精确比分加分更多。</p><p>同时考虑预测场次，减少少量预测带来的偶然波动。</p><p><strong>分数越高，近期预测表现越好。</strong></p><p class="score-range">取最近两年内最多 300 场有效预测，满 50 场参与实力榜。</p><button class="score-text-button" data-action="score-details">查看计算详情</button><button class="primary" data-close>知道了</button>');

function scoreDetails(){
 const count=state.example==='empty'?0:state.example==='threshold'?38:config.strength.n;
 const points=state.example==='empty'?0:state.example==='threshold'?93:Number(config.career.value);

 openModal('预测评分 · 计算详情','<div class="profile-stats"><div><b class="num">'+points+'</b><small>近期预测积分</small></div><div><b class="num">'+count+'</b><small>有效预测场数</small></div><div><b class="num">'+value+'</b><small>预测评分</small></div></div><p>预测评分 =（近期预测积分 + 68）÷（有效预测场数 + 40）</p><p class="score-range">相当于加入 40 场、场均 1.70 分的参考成绩，减少少量预测带来的偶然波动。展示值向下保留两位小数。</p>'+(eligible?'<p>你的评分：('+points+' + 68) ÷ ('+count+' + 40) = <strong>'+value+'</strong></p>':'<p>当前有效预测不足 50 场，暂不展示预测评分，还需 '+(50-count)+' 场参与实力榜。</p>')+'<button class="score-text-button" data-action="score-info">返回评分说明</button><button class="primary" data-close>关闭</button>');

let personalObserver;
function personalStanding(){
 const board=config[state.board];
 const empty=state.example==='empty', threshold=state.example==='threshold';
 const eligible=!empty&&!threshold;
 const rank=state.scope==='group'?(state.group==='zhang'?3:2):{week:231,season:154,career:116,strength:109}[state.board];
 const total=state.scope==='group'?groups[state.group].total:1286;
 const publicRank=eligible&&rank<=20;
 const label=eligible?(publicRank?'第 '+rank+' 名':'前 '+percentile(rank,total)+'%'):'暂无排名';
 const count=empty?0:threshold?38:board.n;
 const value=empty?(state.board==='strength'?'—':'0'):threshold?'—':board.value;
 const status=eligible?'你位于'+(state.scope==='group'?'群内':'全站')+label+'，'+(state.scope==='group'?'群内':'')+board.name.replace('榜','')+'排名第 '+rank+' 名。':threshold?'有效预测 38 / 50 场，还差 12 场参与排名。':state.board==='strength'?'完成 50 场有效预测并结算后参与排名。':'完成首场有效预测并结算后参与排名。';
 return {board,empty,threshold,eligible,rank,total,publicRank,label,count,value,status,hits:empty?0:threshold?2:board.hits};
}
function enhancePersonalView(){
 const me=personalStanding(), hero=app.querySelector('.hero');
 const scope=state.scope==='group'?'群内':'全站';
 const title=exploration===2?'我的位置与表现':'我的'+me.board.name.replace('榜','')+'表现';
 hero.setAttribute('aria-label',title);
 hero.innerHTML='<div class="hero-top"><h2>'+title+'</h2><span class="hero-stamp">'+(state.board==='week'?(state.period==='previous'?'上周 · 已封榜':'本周进行中'):state.board==='strength'?'已更新':'已更新快照')+'</span></div><div class="hero-metrics"><div><b class="num">'+me.label+'</b><small>我的'+(scope==='群内'?'群内排名':'排名')+'</small></div><div><b class="num">'+me.value+'</b><small>我的'+(state.board==='strength'?'预测评分':me.board.metric)+'</small></div><div><b class="num">'+me.total.toLocaleString()+'</b><small>'+scope+'入榜人数</small></div></div><div class="personal-status"><p><strong>'+me.status+'</strong></p>'+(state.board==='week'&&state.period==='previous'?'<p class="subtle">上周布局演示 · 使用相同示例数据</p>':'')+'</div>'+(exploration===3?'<div class="personal-detail"><span>'+(state.board==='strength'?'窗口有效预测':'有效预测')+' <b class="num">'+me.count+'</b> 场</span><span>精确命中 <b class="num">'+me.hits+'</b> 次</span></div>':'');

  const scoreLabel=hero.querySelector('.hero-metrics>div:nth-child(2) small');

  scoreLabel.innerHTML='预测评分<button class="score-help" data-action="score-info" aria-label="了解预测评分" title="了解预测评分">?</button>';

 if(exploration===2){
  const podium=app.querySelector('.podium');
  heading.before(podium);
