<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赛事预言家 · v0.3-cc 状态图册</title>
<style>
*{box-sizing:border-box;letter-spacing:0}
body{margin:0;background:#e8eee7;color:#163024;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{max-width:1100px;margin:auto;padding:22px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:20px;margin:0}h1 span{font-weight:400;font-size:13px;color:#42564a}
a{color:#1a5c26;text-decoration:none}
main{max-width:1100px;margin:auto;padding:0 16px 28px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:28px;align-items:start}
.panel{background:rgba(255,255,255,.7);border:1px solid #fff;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(23,60,35,.08)}
label{display:block;font-size:12px;font-weight:600;color:#42564a;margin-bottom:6px}
select{width:100%;font:13px inherit;background:#fff;border:1px solid #c5d5c8;border-radius:8px;padding:9px 10px;color:#163024}
.nav{display:flex;gap:8px;margin:12px 0 4px}
.nav button{flex:1;font:12px inherit;background:#fff;border:1px solid #c5d5c8;border-radius:8px;padding:7px 0;color:#163024;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
h2{font-size:15px;margin:18px 0 4px}
p{margin:0 0 8px;color:#3b4f43}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tags span{font-size:11px;padding:2px 8px;border-radius:6px;background:#e8f8df;color:#1a5c26}
ul{margin:6px 0 0;padding-left:18px;color:#3b4f43}
li{margin:2px 0}
.stage{position:sticky;top:12px}
.stage .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
iframe{display:block;width:390px;height:844px;border:0;border-radius:24px;background:#fff;box-shadow:0 12px 40px rgba(23,60,35,.22)}
footer{text-align:center;padding:0 16px 24px;font-size:11px;color:#52665b}
@media(max-width:900px){main{grid-template-columns:minmax(0,390px);justify-content:center}.stage{position:static}}
</style>
</head>
<body>
<header>
  <h1>赛事预言家 <span>v0.3-cc · 状态图册（基于 v0.2.2-cc 与 UI_DESIGN_SYSTEM.md）</span></h1>
  <a href="README-cc.md">查看说明</a>
</header>
<main>
  <section class="panel">
    <label for="state">选择页面状态</label>
    <select id="state" aria-label="选择页面状态"></select>
    <div class="nav"><button id="prev" type="button">← 上一个</button><button id="next" type="button">下一个 →</button></div>
    <h2 id="title"></h2>
    <div class="tags" id="tags"></div>
    <p id="desc"></p>
    <ul id="points"></ul>
  </section>
  <section class="stage">
    <div class="bar"><span id="where"></span><a id="open" target="_blank" rel="noopener">单独打开 ↗</a></div>
    <iframe id="frame" title="页面预览"></iframe>
  </section>
</main>
<footer>示例数据 · 离线交互设计稿 · 各状态均为完整页面</footer>
<script>
const GROUPS=[
 ['排行榜 · 空榜与少人',[
  ['R01','空榜 · 全站周榜（上线初期）','rankings-states.html',['X01','空榜'],'上线初期没有任何结算。只有周榜一个标签；周选择器只有「本周」。',['生涯、赛季、实力标签均不显示','空状态：文案 + 「去预测」','概览卡：入榜人数 0、暂无排名']],
  ['R02','空榜 · 群周榜（新建群）','rankings-states.html',['X01','空榜','群范围'],'新建的群里还没人预测过。范围入口显示群名。',['空状态多一个「邀请好友」','群范围下生涯、赛季标签不显示']],
  ['R03','少人 · 仅 1 人（只有自己）','rankings-states.html',['X01','X02','少人榜'],'入榜只有你一个人。不显示领奖台，第 1 名放大展示。',['标题「全部 1 位预言家」','底部「邀请好友建个群」']],
  ['R04','少人 · 2 人','rankings-states.html',['X01','X02','少人榜'],'2 人入榜，依旧不显示领奖台。',['第 1 名放大卡片 + 列表','标题「全部 2 位预言家」']],
  ['R05','少人 · 5 人','rankings-states.html',['X01','X02','少人榜'],'3–19 人：显示领奖台，标题改为「全部 N 位预言家」。',['不再写「全站前 20」','底部「邀请好友建个群」']],
  ['R06','常态 · 20 人以上','rankings-states.html',['基线'],'人数 ≥ 20 的常态页面，与 v0.2.2-cc 一致，用作对照。',['新增块全部不出现']],
  ['R17','实力榜 · 4 人满 50 场','rankings-states.html',['X01','实力榜'],'满 50 场的人很少时，实力榜同样按少人规则显示。',['我的排名第 2 名（共 4 人）']]
 ]],
 ['排行榜 · 游客、范围与选择器',[
  ['R07','游客 · 请登录查看榜单','rankings-states.html',['X13','游客'],'排行榜需登录。游客看到模糊的灰色条纹占位和居中的一行提示。',['占位里没有用户名、头像、分数','页头显示「你好，游客」，无 ID 标签','不请求榜单数据']],
  ['R16','无群用户 · 范围弹层','rankings-states.html',['X03','群入口'],'没有加入任何群的用户点页头「全站」胶囊。「我的群」是未解锁行，点击进入群引导页。',['不出现任何群选项','点击「我的群」跳转到群引导页（G01）']],
  ['R13','周选择器 · 最近 4 周','rankings-states.html',['X16','周选择'],'周选择只列最近 4 周，且不早于上线周。',['底部提示「仅显示最近 4 周」']],
  ['R14','周一 · 默认显示上周榜','rankings-states.html',['X04','默认周'],'北京时间周一默认显示上周榜。不出现「已封榜」字样，只显示更新时间。',['周选择显示「上周」','仍可手动切到本周']],
  ['R15','国际比赛日 · 回溯到最近有人入榜的周','rankings-states.html',['X04','回溯'],'本周无结算，默认回溯到最近一个有人入榜的周，只显示该周榜单。',['更新时间显示「6 天前更新」','无额外说明文字']]
 ]],
 ['排行榜 · 赛季',[
  ['R08','首个赛季 · 生涯榜提示','rankings-states.html',['X08','首赛季'],'参与不满 2 个赛季：没有赛季榜标签。生涯榜顶部提示它与赛季榜相同。',['标签：本周 / 生涯 / 实力']],
  ['R09','新赛季初 · 赛季榜','rankings-states.html',['X09','赛季初'],'赛季刚开始，榜上只有 8 人。顶部提示名次变化会比较大。',['赛季选择：2027/28 赛季']],
  ['R10','新赛季交接 · 上赛季终榜','rankings-states.html',['X15','X07','终榜'],'新赛季尚无人入榜，默认显示上赛季终榜，并带上赛季回顾卡。',['赛季选择：2026/27 赛季 · 上赛季','更新时间「5 天前更新」']],
  ['R11','新赛季交接 · 等待最终确认','rankings-states.html',['X15','临时榜'],'终榜尚未生成的那几天，显示上赛季最后一版快照并标注「等待最终确认」。',['右侧标签：等待最终确认']],
  ['R12','赛季选择器 · 展开','rankings-states.html',['X15','赛季选择'],'切换往期赛季的弹层。往期赛季只显示全站榜。',['选项：当前赛季（暂无人入榜）/ 上赛季']],
  ['R18','10 天未预测 · 隐藏更新时间','rankings-states.html',['X05','活跃度'],'距上次提交预测超过 10 天，生涯榜隐藏更新时间；排名与积分保留。',['沿用 v0.2.2-cc 的规则']]
 ]],
 ['「我的」页',[
  ['M01','常态 · 首个赛季（无回顾卡）','my-states.html',['基线'],'首个赛季的用户：没有上赛季回顾卡。有一个群。',['点击「全部预测」进入最近预测页']],
  ['M02','新赛季 · 上赛季回顾卡','my-states.html',['X07','回顾卡'],'升级进度卡下方出现「上赛季回顾」：积分、最高等级、有效预测。',['来自个人赛季统计，不依赖历史榜单']],
  ['M03','无群 · 我的预言群为空','my-states.html',['X03','无群'],'「我的预言群」没有群时的空状态，保留「邀请码加入」和「创建预言群」。',['点击按钮进入群页面']]
 ]],
 ['最近预测（我的 → 全部预测）',[
  ['P01','最近预测 · 初次进入','predictions-states.html',['X12','8 周回看'],'按比赛所在周分组，先显示本周和上周，底部「加载更多」。',['含精确命中、胜平负命中、未命中、待开赛、进行中']],
  ['P02','最近预测 · 已翻到第 8 周','predictions-states.html',['X12','8 周回看'],'连续加载后已显示最近 8 周，仍有更早的数据可继续加载（不设硬上限）。',['底部仍有「加载更多」']],
  ['P03','最近预测 · 已到最早','predictions-states.html',['X12'],'没有更早的预测了。',['底部文字「没有更早的预测了」']],
  ['P04','最近预测 · 空','predictions-states.html',['X12','空状态'],'还没有任何预测的用户。',['文案 + 「去预测」']]
 ]],
 ['预言群（新页面）',[
  ['G01','群引导 · 无群用户','group-states.html',['X03','新页面'],'没有加入任何群的用户进入这里：创建，或输入邀请码加入。',['规则：每群独立排名、最多创建 5 个 / 加入 20 个、每群 500 人']],
  ['G02','输入邀请码','group-states.html',['新页面'],'8 位邀请码输入，未填满时「加入」不可点。',['已输入 4 位，还差 4 位']],
  ['G03','创建成功 · 邀请码','group-states.html',['新页面'],'创建后显示邀请码和分享入口。',['群名自动为「xx的预言群」','成员 1 / 500']]
 ]]
];
const flat=[];const sel=document.getElementById('state');
GROUPS.forEach(([name,items])=>{const og=document.createElement('optgroup');og.label=name;items.forEach(it=>{flat.push(it);const o=document.createElement('option');o.value=it[0];o.textContent=it[0]+' · '+it[1];og.appendChild(o);});sel.appendChild(og);});
const frame=document.getElementById('frame');
function show(id,push){
 const i=flat.findIndex(x=>x[0]===id);const it=flat[i>=0?i:0];sel.value=it[0];
 const url=it[2]+'?state='+it[0];
 frame.src=url;document.getElementById('open').href=url;
 document.getElementById('title').textContent=it[0]+' · '+it[1];
 document.getElementById('tags').innerHTML=it[3].map(t=>'<span>'+t+'</span>').join('');
 document.getElementById('desc').textContent=it[4];
 document.getElementById('points').innerHTML=it[5].map(t=>'<li>'+t+'</li>').join('');
 document.getElementById('where').textContent=it[2].replace('-states.html','')+' · 完整页面';
 const idx=flat.indexOf(it);document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===flat.length-1;
 if(push!==false)history.replaceState(null,'','#'+it[0]);
}
sel.addEventListener('change',()=>show(sel.value));
document.getElementById('prev').addEventListener('click',()=>{const i=flat.findIndex(x=>x[0]===sel.value);if(i>0)show(flat[i-1][0]);});
document.getElementById('next').addEventListener('click',()=>{const i=flat.findIndex(x=>x[0]===sel.value);if(i<flat.length-1)show(flat[i+1][0]);});
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='ArrowRight')document.getElementById('next').click();});
show(location.hash.slice(1)||'R01');
</script>
</body>
</html>
