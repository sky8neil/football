<script>
const id=new URLSearchParams(location.search).get('state')||'G01';
const back='<a class="back" href="my-states.html?state=M03" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>';
const I={
 group:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3m1-15a3 3 0 0 1 0 6m1 3a5 5 0 0 1 4 5"/></svg>',

 chev:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>',
 ok:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
};
function head(t,sub){return '<div class="subhead">'+back+'<div class="grow"><h1>'+t+'</h1><p>'+sub+'</p></div></div>';}
function boxes(code){const cells=[];for(let i=0;i<8;i++){const ch=code[i]||'';cells.push('<span class="'+(ch?'':'empty')+(i===code.length?' cur':'')+'">'+(ch||'')+'</span>');}return '<div class="code-boxes" aria-label="邀请码">'+cells.join('')+'</div>';}
let html='';
if(id==='G01'){
 html=head('预言群','和熟悉的人，一起看球')+
 '<section class="ccs-card guide-hero"><div class="empty-art">'+I.group+'</div><h2>你还没有加入任何群</h2><p>每个群独立排名，<br>在群里和朋友比一比谁更懂球</p></section>'+
 '<div class="guide-actions">'+
 '<a class="ccs-card guide-action" href="group-states.html?state=G03"><span class="art">'+I.plus+'</span><span class="copy"><b>创建我的预言群</b><small>群名自动为「徐sir的预言群」，最多创建 5 个</small></span>'+I.chev+'</a>'+

}else if(id==='G02'){
 html=head('加入预言群','输入群主分享的邀请码')+
 '<section class="ccs-card code-panel"><h2>邀请码</h2><p>由 8 位大写字母和数字组成</p>'+boxes('K7M2')+'<button class="ccs-cta" type="button" disabled>加入</button><div class="hint">还差 4 位</div></section>';
}else{
 html=head('创建成功','把邀请码发给朋友')+
 '<section class="ccs-card success-panel"><div class="empty-art">'+I.ok+'</div><h2>徐sir的预言群</h2><p>已创建，你是群主</p><div class="invite-code">K7M2 9XQA</div><p>邀请码在群设置里随时可查看</p><div class="row-actions"><button class="ccs-cta" type="button">分享到微信</button><button class="ccs-ghost" type="button">复制邀请码</button></div></section>'+
 '<section class="ccs-card info-list"><div><span>群成员</span><b>1 / 500</b></div><div><span>群榜单</span><b>成员有预测后出现</b></div><div><span>我创建的群</span><b>1 / 5</b></div></section>';
}
document.getElementById('page').innerHTML=html;
</script>
