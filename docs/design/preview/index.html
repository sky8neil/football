<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赛事预言家 · UI 审核预览台（9 页面）</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1e293b;
      --border: #2b384e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.14);
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.16);
      --info: #38bdf8;
      --info-soft: rgba(56, 189, 248, 0.15);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .brand {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .brand p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 20px;
    }
    .group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 10px 6px;
    }
    .page-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 4px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s;
    }
    .page-btn:hover {
      background: var(--panel-2);
    }
    .page-btn.active {
      background: var(--accent-soft);
      border-color: rgba(34, 197, 94, 0.45);
    }
    .page-name {
      font-size: 13px;
      font-weight: 600;
      display: block;
    }
    .page-slug {
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
      flex: none;
    }
    .badge-todo { background: var(--warn-soft); color: var(--warn); }
    .badge-polish { background: var(--info-soft); color: var(--info); }
    .badge-ready { background: var(--accent-soft); color: var(--accent); }

    .main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .current-title {
      font-size: 15px;
      font-weight: 700;
    }
    .current-path {
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tool-select, .tool-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }
    .tool-btn:hover {
      border-color: #475569;
      background: #273549;
    }
    .tool-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #052e16;
      font-weight: 700;
    }
    .tool-btn.primary:hover {
      filter: brightness(1.06);
    }

    .stage {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 197, 94, 0.08), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.08), transparent 45%),
        var(--bg);
    }
    .phone-frame {
      background: #0b1120;
      border: 10px solid #1e293b;
      border-radius: 38px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: width 0.2s, height 0.2s;
      flex: none;
    }
    .phone-notch {
      height: 26px;
      background: #0b1120;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }
    .phone-pill {
      width: 96px;
      height: 6px;
      border-radius: 999px;
      background: #334155;
    }
    .desktop-frame {
      width: 100%;
      max-width: 1320px;
      height: calc(100vh - 110px);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .desktop-bar {
      height: 32px;
      background: #1e293b;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 6px;
      flex: none;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #475569;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      flex: 1;
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
        max-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>赛事预言家 · UI 预览台</h1>
        <p>9 个页面审核与迭代工作台（无缓存实时刷新）</p>
      </div>
      <div id="nav-list" class="nav-scroll"></div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="toolbar-left">
          <span id="current-title" class="current-title">-</span>
          <span id="current-badge" class="badge"></span>
          <span id="current-path" class="current-path">-</span>
        </div>
        <div class="toolbar-actions">
          <select id="viewport-select" class="tool-select" title="切换预览尺寸">
            <option value="375x812">iPhone 375 × 812</option>
            <option value="390x844">iPhone 390 × 844</option>
            <option value="430x932">Pro Max 430 × 932</option>
            <option value="desktop">桌面宽屏 (100%)</option>
          </select>
          <button id="refresh-btn" type="button" class="tool-btn primary" title="快捷键 R">↻ 刷新当前页</button>
          <a id="open-tab-link" class="tool-btn" href="#" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;">↗ 独立打开</a>
        </div>
      </header>

      <section class="stage">
        <div id="preview-frame-wrap" class="phone-frame" style="width: 375px; height: 812px;">
          <div id="frame-chrome" class="phone-notch"><span class="phone-pill"></span></div>
          <iframe id="preview-iframe" title="页面预览"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script>
    const PAGES = [
      {
        group: "一、必改（当前较简陋）",
        id: "unlocks",
        title: "解锁记录页",
        status: "待设计",
        badgeClass: "badge-todo",
        url: "./pages/unlocks.html",
        sourcePath: "miniprogram/pages/unlocks/",
        defaultViewport: "375x812"
      },
      {
        group: "一、必改（当前较简陋）",
        id: "settings",
        title: "设置与注销页",
        status: "待设计",
        badgeClass: "badge-todo",
        url: "./pages/settings.html",
        sourcePath: "miniprogram/pages/settings/",
        defaultViewport: "375x812"
      },
      {
        group: "二、可精修（基础已可用）",
        id: "share-card",
        title: "分享卡页",
        status: "可精修",
        badgeClass: "badge-polish",
        url: "./pages/share-card.html",
        sourcePath: "miniprogram/pages/share-card/",
        defaultViewport: "375x812"
      },
      {
        group: "二、可精修（基础已可用）",
        id: "public-profile",
        title: "他人公开主页",
        status: "可精修",
        badgeClass: "badge-polish",
        url: "./pages/public-profile.html",
        sourcePath: "miniprogram/pages/public-profile/",
        defaultViewport: "375x812"
      },
      {
        group: "二、可精修（基础已可用）",
        id: "match-detail",
        title: "比赛详情页",
        status: "可精修",
        badgeClass: "badge-polish",
        url: "./pages/match-detail.html",
        sourcePath: "miniprogram/pages/match-detail/",
        defaultViewport: "375x812"
      },
      {
        group: "三、已成熟（基线参照）",
        id: "matches",
        title: "赛程首页",
        status: "已定稿",
        badgeClass: "badge-ready",
        url: "./pages/matches.html",
        sourcePath: "miniprogram/pages/matches/",
        defaultViewport: "375x812"
      },
      {
        group: "三、已成熟（基线参照）",
        id: "profile",
        title: "个人中心页",
        status: "已定稿",
        badgeClass: "badge-ready",
        url: "./pages/profile.html",
        sourcePath: "miniprogram/pages/profile/",
        defaultViewport: "375x812"
      },
      {
        group: "三、已成熟（基线参照）",
        id: "rankings",
        title: "排行榜页",
        status: "已定稿",
        badgeClass: "badge-ready",
        url: "./pages/rankings.html",
        sourcePath: "miniprogram/pages/rankings/",
        defaultViewport: "375x812"
      },
      {
        group: "三、已成熟（基线参照）",
        id: "admin",
        title: "Web 运维管理台",
        status: "已定稿",
        badgeClass: "badge-ready",
        url: "/admin/index.html",
        sourcePath: "admin/",
        defaultViewport: "desktop"
      }
    ];

    const navList = document.getElementById("nav-list");
    const currentTitle = document.getElementById("current-title");
    const currentBadge = document.getElementById("current-badge");
    const currentPath = document.getElementById("current-path");
    const viewportSelect = document.getElementById("viewport-select");
    const refreshBtn = document.getElementById("refresh-btn");
    const openTabLink = document.getElementById("open-tab-link");
    const frameWrap = document.getElementById("preview-frame-wrap");
    const frameChrome = document.getElementById("frame-chrome");
    const iframe = document.getElementById("preview-iframe");

    let activePage = PAGES[0];

    function renderNav() {
      navList.innerHTML = "";
      let lastGroup = "";
      for (const page of PAGES) {
        if (page.group !== lastGroup) {
          lastGroup = page.group;
          const label = document.createElement("div");
          label.className = "group-label";
          label.textContent = page.group;
          navList.appendChild(label);
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "page-btn" + (page.id === activePage.id ? " active" : "");
        btn.dataset.pageId = page.id;
        btn.innerHTML = `
          <span>
            <span class="page-name">${page.title}</span>
            <span class="page-slug">${page.id}</span>
          </span>
          <span class="badge ${page.badgeClass}">${page.status}</span>
        `;
        btn.addEventListener("click", () => selectPage(page.id));
        navList.appendChild(btn);
      }
    }

    function applyViewport(mode) {
      if (mode === "desktop") {
        frameWrap.className = "desktop-frame";
        frameWrap.style.width = "";
        frameWrap.style.height = "";
        frameChrome.className = "desktop-bar";
        frameChrome.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        return;
      }
      const [w, h] = mode.split("x");
      frameWrap.className = "phone-frame";
      frameWrap.style.width = w + "px";
      frameWrap.style.height = h + "px";
      frameChrome.className = "phone-notch";
      frameChrome.innerHTML = '<span class="phone-pill"></span>';
    }

    function loadIframe() {
      const sep = activePage.url.includes("?") ? "&" : "?";
      const freshUrl = activePage.url + sep + "_t=" + Date.now();
      iframe.src = freshUrl;
      openTabLink.href = activePage.url;
    }

    function selectPage(id) {
      const found = PAGES.find((p) => p.id === id);
      if (!found) return;
      activePage = found;
      window.location.hash = found.id;
      currentTitle.textContent = found.title;
      currentBadge.textContent = found.status;
      currentBadge.className = "badge " + found.badgeClass;
      currentPath.textContent = found.sourcePath;
      viewportSelect.value = found.defaultViewport;
      applyViewport(found.defaultViewport);
      renderNav();
      loadIframe();
    }

    viewportSelect.addEventListener("change", () => applyViewport(viewportSelect.value));
    refreshBtn.addEventListener("click", loadIframe);
    window.addEventListener("keydown", (e) => {
      if ((e.key === "r" || e.key === "R") && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== "INPUT") {
        loadIframe();
      }
    });

    const initialHash = window.location.hash.replace(/^#/, "");
    const initialPage = PAGES.find((p) => p.id === initialHash)?.id || PAGES[0].id;
    selectPage(initialPage);
  </script>
</body>
</html>
