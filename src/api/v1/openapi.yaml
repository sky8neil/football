          type: boolean
    PagedData:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
        page:
          $ref: '#/components/schemas/Page'
    PagedEnvelope:
      type: object
      description: 分页成功响应（规范 23.2）
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/PagedData'
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      description: 错误响应（规范 23.6）；message 仅供展示，程序判断使用 code
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: 请求参数错误
        request_id:
          type: string
        details:
          nullable: true
    IdempotencyKey:
      type: string
      format: uuid
      description: 预测业务幂等键，必须是 UUID v4（规范 23.3）
    Cursor:
      type: string
      description: 服务端 opaque cursor（规范 23.8）；客户端不得解析或构造
    Limit:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
  responses:
    ValidationError:
      description: 422 VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 404 *_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PredictionHistoryNotFound:
      description: 404 USER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnlocksUserNotFound:
      description: 404 USER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 409 业务冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PredictionHistoryConflict:
      description: "409 用户状态冲突：USER_DELETED"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnlocksUserDeleted:
      description: 409 USER_DELETED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 500 INTERNAL_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 401 UNAUTHORIZED（缺少可信身份；预测 POST 另见 49.2 错误码）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PredictionRejected:
      description: "409 预测拒绝（49.2 映射）：USER_DELETED / PREDICTION_ALREADY_SUBMITTED / MATCH_NOT_PREDICTABLE / PREDICTION_LOCKED"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 403 FORBIDDEN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 429 RATE_LIMITED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
