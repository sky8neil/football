        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/rebuild/users/{user_id}:
    post:
      tags: [admin]
      summary: 重建用户统计
      x-requires-trusted-openid: true
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyAdminRequest'
      responses:
        '200':
          description: 用户统计重建结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRebuildUserStatsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/rebuild/rankings:
    post:
      tags: [admin]
      summary: 重建周期排行榜
      x-requires-trusted-openid: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRebuildRankingsRequest'
      responses:
        '200':
          description: 周期排行榜重建结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRebuildRankingsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    SchemaVersion:
      type: integer
      const: 1
      description: 核心业务文档 schema_version 固定为 1（规范 2.5）
    MatchStatus:
      type: string
      enum: [scheduled, live, finished, postponed, cancelled, abandoned]
    SettlementStatus:
      type: string
      enum: [pending, waiting, settling, settled, correcting, failed, voided]
    Result:
      type: string
      enum: [HOME, DRAW, AWAY]
    ResultSource:
      type: string
      enum: [provider, admin]
    LeagueId:
      type: string
      enum: [premier_league, la_liga, serie_a, bundesliga, ligue_1, chinese_super_league]
    MatchScore:
      type: integer
      enum: [0, 3, 12]
      description: 单场计分结果（规范 9.2）
    RegularScore:
      type: object
      properties:
        regular_home_score:
          type: integer
          minimum: 0
          maximum: 99
          nullable: true
        regular_away_score:
          type: integer
          minimum: 0
          maximum: 99
          nullable: true
      additionalProperties: false
    MatchTeam:
      type: object
      additionalProperties: false
      required: [team_id, name]
      properties:
        team_id:
          type: string
          format: uuid
        name:
          type: string
    MatchListItem:
      type: object
      additionalProperties: false
      required: [match_id, league_id, season_id, round_id, home_team, away_team, kickoff_at, prediction_deadline_at, prediction_closed_at, match_status, regular_home_score, regular_away_score, can_predict, can_predict_reason]
      properties:
        match_id:
          type: string
          format: uuid
        league_id:
          $ref: '#/components/schemas/LeagueId'
        season_id:
          type: string
          enum: [2026_2027, '2026']
        round_id:
          type: string
        home_team:
          $ref: '#/components/schemas/MatchTeam'
        away_team:
          $ref: '#/components/schemas/MatchTeam'
        kickoff_at:
          type: string
          format: date-time
        prediction_deadline_at:
          type: string
          format: date-time
          nullable: true
        prediction_closed_at:
          type: string
          format: date-time
          nullable: true
        match_status:
          $ref: '#/components/schemas/MatchStatus'
        regular_home_score:
          type: integer
          minimum: 0
          maximum: 99
          nullable: true
        regular_away_score:
          type: integer
          minimum: 0
          maximum: 99
          nullable: true
        can_predict:
          type: boolean
        can_predict_reason:
          type: string
          enum: [AUTH_REQUIRED, USER_DELETED, ALREADY_SUBMITTED, KICKOFF_UNCONFIRMED, NOT_SCHEDULED, CLOSED]
          nullable: true
    MatchesData:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MatchListItem'
        page:
          $ref: '#/components/schemas/Page'
    MatchesEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/MatchesData'
        request_id:
          type: string
    MyMatchPrediction:
      type: object
      additionalProperties: false
      required: [prediction_id, pred_home_score, pred_away_score, derived_result, submitted_at, match_score, wdl_hit, exact_hit]
      properties:
        prediction_id:
          type: string
          format: uuid
        pred_home_score:
          type: integer
          minimum: 0
          maximum: 20
        pred_away_score:
          type: integer
          minimum: 0
          maximum: 20
        derived_result:
          $ref: '#/components/schemas/Result'
        submitted_at:
          type: string
          format: date-time
        match_score:
          type: integer
          enum: [0, 3, 12]
          nullable: true
        wdl_hit:
          type: boolean
          nullable: true
        exact_hit:
          type: boolean
          nullable: true
    MatchDetailData:
      type: object
      additionalProperties: false
      required: [match_id, league_id, season_id, round_id, home_team, away_team, kickoff_at, prediction_deadline_at, prediction_closed_at, match_status, regular_home_score, regular_away_score, can_predict, can_predict_reason, my_prediction]
      properties:
        match_id:
          type: string
          format: uuid
        league_id:
          $ref: '#/components/schemas/LeagueId'
        season_id:
          type: string
          enum: [2026_2027, '2026']
        round_id:
          type: string
        home_team:
          $ref: '#/components/schemas/MatchTeam'
        away_team:
          $ref: '#/components/schemas/MatchTeam'
        kickoff_at:
          type: string
          format: date-time
        prediction_deadline_at:
          type: string
          format: date-time
          nullable: true
        prediction_closed_at:
          type: string
          format: date-time
          nullable: true
        match_status:
          $ref: '#/components/schemas/MatchStatus'
        regular_home_score:
          type: integer
          minimum: 0
          maximum: 99
          nullable: true
        regular_away_score:
          type: integer
          minimum: 0
          maximum: 99
          nullable: true
        can_predict:
          type: boolean
        can_predict_reason:
          type: string
          enum: [AUTH_REQUIRED, USER_DELETED, ALREADY_SUBMITTED, KICKOFF_UNCONFIRMED, NOT_SCHEDULED, CLOSED]
          nullable: true
        my_prediction:
          allOf:
            - $ref: '#/components/schemas/MyMatchPrediction'
          nullable: true
    MatchDetailEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/MatchDetailData'
        request_id:
          type: string
    CrowdDistribution:
      type: object
      additionalProperties: false
      required: [home, draw, away]
      properties:
        home:
          type: integer
          minimum: 0
          maximum: 100
          multipleOf: 5
        draw:
          type: integer
          minimum: 0
          maximum: 100
          multipleOf: 5
        away:
          type: integer
          minimum: 0
          maximum: 100
          multipleOf: 5
    CrowdData:
      type: object
      additionalProperties: false
      required: [match_id, status, distribution, granularity, min_predictions]
      properties:
        match_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [not_closed, insufficient, available, unavailable]
        distribution:
          allOf:
            - $ref: '#/components/schemas/CrowdDistribution'
          nullable: true
        granularity:
          type: integer
          const: 5
        min_predictions:
          type: integer
          const: 20
    CrowdEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/CrowdData'
        request_id:
          type: string
    SuccessEnvelope:
      type: object
      description: 非分页成功响应（规范 23.2）
      required: [data, request_id]
      properties:
        data: {}
        request_id:
          type: string
    ShareCardData:
      type: object
      additionalProperties: false
      required: [user_id, display_name, favorite_team_id, season_level, league_id, round_id, round_predictions, round_wdl_hits, round_exact_hits, round_score, career_points]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        favorite_team_id:
          type: string
          format: uuid
          nullable: true
        season_level:
          type: integer
          minimum: 1
          maximum: 6
        league_id:
          $ref: '#/components/schemas/LeagueId'
        round_id:
          type: string
          pattern: '^[0-9]{2}$'
        round_predictions:
          type: integer
          minimum: 0
        round_wdl_hits:
          type: integer
          minimum: 0
        round_exact_hits:
          type: integer
          minimum: 0
        round_score:
          type: integer
          minimum: 0
        career_points:
          type: integer
          minimum: 0
    ShareCardEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/ShareCardData'
        request_id:
          type: string
    RankingItem:
      oneOf:
        - $ref: '#/components/schemas/WeekRankingItem'
        - $ref: '#/components/schemas/CareerRankingItem'
        - $ref: '#/components/schemas/SeasonRankingItem'
        - $ref: '#/components/schemas/StrengthRankingItem'
    WeekRankingItem:
      type: object
      additionalProperties: false
      required: [rank, user_id, display_name, favorite_team_id, career_level, period_score, valid_predictions, exact_hits, last_scoring_match_at]
      properties:
        rank:
          type: integer
          minimum: 1
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        favorite_team_id:
          type: string
          format: uuid
          nullable: true
        career_level:
          type: integer
          minimum: 1
          maximum: 6
        period_score:
          type: integer
          minimum: 0
        valid_predictions:
          type: integer
          minimum: 1
        exact_hits:
          type: integer
          minimum: 0
        last_scoring_match_at:
          type: string
          format: date-time
          nullable: true
    CareerRankingItem:
      type: object
      additionalProperties: false
      required: [rank, user_id, display_name, favorite_team_id, career_level, career_points, career_valid_predictions, exact_hits, last_scoring_match_at]
      properties:
        rank:
          type: integer
          minimum: 1
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        favorite_team_id:
          type: string
          format: uuid
          nullable: true
        career_level:
          type: integer
          minimum: 1
          maximum: 6
        career_points:
          type: integer
          minimum: 0
        career_valid_predictions:
          type: integer
          minimum: 1
        exact_hits:
          type: integer
          minimum: 0
        last_scoring_match_at:
          type: string
          format: date-time
          nullable: true
    StrengthRankingItem:
      type: object
      additionalProperties: false
      required: [rank, user_id, display_name, favorite_team_id, career_level, strength_index, window_n]
      properties:
        rank:
          type: integer
          minimum: 1
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        favorite_team_id:
          type: string
          format: uuid
          nullable: true
        career_level:
          type: integer
          minimum: 1
          maximum: 6
        strength_index:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        window_n:
          type: integer
          minimum: 50
    SeasonRankingItem:
      type: object
      additionalProperties: false
      required: [rank, user_id, display_name, favorite_team_id, career_level, season_points, season_valid_predictions, exact_hits, last_scoring_match_at]
      properties:
        rank:
          type: integer
          minimum: 1
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        favorite_team_id:
          type: string
          format: uuid
          nullable: true
        career_level:
          type: integer
          minimum: 1
          maximum: 6
        season_points:
          type: integer
          minimum: 0
        season_valid_predictions:
          type: integer
          minimum: 1
        exact_hits:
          type: integer
          minimum: 0
        last_scoring_match_at:
          type: string
          format: date-time
          nullable: true
    RankingData:
      type: object
      additionalProperties: false
      required: [board, scope, period_key, updated_at, server_now, available_boards, seasons_participated, entry_count, items, page, me]
      properties:
        board:
          type: string
          enum: [week, career, strength, season]
        scope:
          type: string
          enum: [global, group]
        period_key:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        server_now:
          type: string
          format: date-time
          description: 服务端当前时间，ISO 8601 UTC；与 updated_at 使用相同时间格式
        current_period_key:
          type: string
          description: board=week 时的北京时间当前 ISO 周 key
        available_boards:
          type: array
          items:
            type: string
            enum: [week, career, strength, season]
        seasons_participated:
          type: integer
          minimum: 0
        entry_count:
          type: integer
          minimum: 0
        available_level_seasons:
          type: array
          description: 仅列出至少有 1 名入榜者的当前赛季、上赛季及历史终榜赛季，按赛季倒序；空赛季和仅含 head 的赛季不列出
          items:
            type: string
            pattern: '^[0-9]{4}_[0-9]{4}$'
        level_season_id:
          type: string
          nullable: true
        is_provisional:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/RankingItem'
        page:
          $ref: '#/components/schemas/Page'
        me:
          $ref: '#/components/schemas/RankingMe'
    RankingMe:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, rank, top_percent]
          properties:
            status:
              type: string
              const: ranked
            rank:
              type: integer
              nullable: true
            top_percent:
              type: integer
              nullable: true
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              const: not_participated
        - type: object
          additionalProperties: false
          required: [status, remaining_valid_predictions]
          properties:
            status:
              type: string
              const: below_threshold
            remaining_valid_predictions:
              type: integer
              minimum: 1
        - type: object
          additionalProperties: false
          required: [status, seasons_participated]
          properties:
            status:
              type: string
              const: not_eligible
            seasons_participated:
              type: integer
              minimum: 0
