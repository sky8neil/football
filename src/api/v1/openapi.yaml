      additionalProperties: false
      required: [anomaly_id, anomaly_key, match_id, type, blocking, status, first_seen_at, last_seen_at, occurrence_count, details, resolved_at, resolution]
      properties:
        anomaly_id:
          type: string
          format: uuid
        anomaly_key:
          type: string
        match_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [LIVE_SYNC_STALE, LIVE_TOO_LONG, FINISHED_NO_SCORE, INVALID_FINAL_SCORE, PROVIDER_STATE_CONFLICT, PROVIDER_DATA_INVALID, UNEXPECTED_PROVIDER_STATUS, TEAM_CHANGE_AFTER_PREDICTION, KICKOFF_CHANGE_AFTER_ANCHOR, ADMIN_PROVIDER_RESULT_CONFLICT]
        blocking:
          type: boolean
        status:
          type: string
          enum: [open, resolved]
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        occurrence_count:
          type: integer
          minimum: 1
        details:
          type: object
          additionalProperties: false
          const: {}
        resolved_at:
          type: [string, 'null']
          format: date-time
        resolution:
          type: [string, 'null']
          minLength: 1
      oneOf:
        - properties:
            status:
              const: open
            resolved_at:
              const: null
            resolution:
              const: null
        - properties:
            status:
              const: resolved
            resolved_at:
              type: string
              format: date-time
            resolution:
              type: string
              minLength: 1
    AdminAnomaliesData:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Anomaly'
        page:
          $ref: '#/components/schemas/Page'
    AdminAnomaliesEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/AdminAnomaliesData'
        request_id:
          type: string
    Page:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    PagedData:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
        page:
          $ref: '#/components/schemas/Page'
    PagedEnvelope:
      type: object
      description: 分页成功响应（规范 23.2）
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/PagedData'
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      description: 错误响应（规范 23.6）；message 仅供展示，程序判断使用 code
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: 请求参数错误
        request_id:
          type: string
        details:
          nullable: true
    IdempotencyKey:
      type: string
      format: uuid
      description: 预测业务幂等键，必须是 UUID v4（规范 23.3）
    Cursor:
      type: string
      description: 服务端 opaque cursor（规范 23.8）；客户端不得解析或构造
    Limit:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
  responses:
    ValidationError:
      description: 422 VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 404 *_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PredictionHistoryNotFound:
      description: 404 USER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnlocksUserNotFound:
      description: 404 USER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 409 业务冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PredictionHistoryConflict:
      description: "409 用户状态冲突：USER_DELETED"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnlocksUserDeleted:
      description: 409 USER_DELETED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RankingUserDeleted:
      description: 409 USER_DELETED（已注销账号不能查看排行榜）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MatchCrowdUserDeleted:
      description: 409 USER_DELETED（已注销账号不能查看大家怎么选）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 500 INTERNAL_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 401 UNAUTHORIZED（缺少可信身份；预测 POST 另见 49.2 错误码）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PredictionRejected:
      description: "409 预测拒绝（49.2 映射）：USER_DELETED / PREDICTION_ALREADY_SUBMITTED / MATCH_NOT_PREDICTABLE / PREDICTION_LOCKED"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 403 FORBIDDEN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 429 RATE_LIMITED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
