openapi: 3.1.0
info:
  title: 赛事预言家 MVP API
  version: 2.0.0
  description: |
    依据《赛事预言家 MVP 核心机器可执行规范 v2.0》第 23~30 节。
    本文件为 MVP 2.0 API 合同基线。
    鉴权模型：依赖部署网关/运行环境注入的可信 openid；见根级 x-trusted-runtime-openid。客户端不得传身份凭证。
    Base path: /v1
x-trusted-runtime-openid:
  required_for: auth_required_operations
  identity_field: openid
  injection: gateway_or_runtime
  client_supply_forbidden: true
  notes: >
    身份由部署网关/运行环境注入可信 openid（或等价运行时字段）。
    后端不签发 JWT/Cookie/session token。
    客户端不得在 body/query/header 中提交 openid、user_id 或 JWT 作为业务身份。
    具体网关字段映射由 B3 实现，不改变本 API 合同。
servers:
  - url: https://api.example.com/v1
    description: MVP 生产环境
tags:
  - name: session
  - name: profile
  - name: matches
  - name: predictions
  - name: rankings
  - name: groups
  - name: levels
  - name: unlocks
  - name: share-card
  - name: admin
paths:
  /session/init:
    post:
      tags: [session]
      summary: 初始化用户会话
      x-requires-trusted-openid: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionInitRequest'
      responses:
        '200':
          description: 已存在用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInitEnvelope'
        '201':
          description: 创建用户成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInitEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /matches:
    get:
      tags: [matches]
      summary: 获取公开比赛列表
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: ISO8601 UTC 起始时间（默认 server_now - 24h）
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: ISO8601 UTC 结束时间（默认 server_now + 30d）
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MatchStatus'
        - name: league_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LeagueId'
        - name: limit
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Limit'
        - name: cursor
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Cursor'
      responses:
        '200':
          description: 比赛列表分页数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchesEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /matches/{match_id}:
    get:
      tags: [matches]
      summary: 获取比赛详情
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 比赛详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetailEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /matches/{match_id}/crowd:
    get:
      tags: [matches]
      summary: 获取截止后的大家怎么选分布
      x-requires-trusted-openid: true
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 比赛预测结果分布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrowdEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MatchCrowdUserDeleted'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /predictions:
    post:
      tags: [predictions]
      summary: 提交比分预测
      x-requires-trusted-openid: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionSubmitRequest'
      responses:
        '200':
          description: 幂等重放成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionSubmitEnvelope'
        '201':
          description: 预测创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionSubmitEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/PredictionRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /predictions/me:
    get:
      tags: [predictions]
      summary: 获取我的历史预测
      description: |
        成功响应按 submitted_at DESC、prediction_id DESC 稳定排序。
        next_cursor 仅在 has_more=true 时返回；cursor 是绑定 league_id、season_id、submitted_at 和 prediction_id
        的 base64url + HMAC opaque 游标，客户端不得解析或构造。正式比分缺失时，regular_home_score、
        regular_away_score、match_score、wdl_hit、exact_hit 均为 null。
      x-requires-trusted-openid: true
      parameters:
        - name: league_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LeagueId'
        - name: season_id
          in: query
          required: false
          schema:
            type: string
            enum: [2026_2027, '2026']
          description: 仅可与 league_id 同时提供，且必须匹配该联赛登记赛季
        - name: limit
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Limit'
        - name: cursor
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Cursor'
      responses:
        '200':
          description: 我的历史预测分页数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionHistoryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PredictionHistoryNotFound'
        '409':
          $ref: '#/components/responses/PredictionHistoryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /predictions/me/{prediction_id}:
    get:
      tags: [predictions]
      summary: 获取我的单条历史预测
      x-requires-trusted-openid: true
      parameters:
        - name: prediction_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 当前用户的预测详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/PredictionHistoryConflict'
        '404':
          $ref: '#/components/responses/PredictionHistoryNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /profiles/{user_id}:
    get:
      tags: [profile]
      summary: 获取公开用户战绩
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 公开用户战绩
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfileEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /profile/me:
    get:
      tags: [profile]
      summary: 获取我的完整用户资料
      x-requires-trusted-openid: true
      responses:
        '200':
          description: 当前用户完整资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [profile]
      summary: 更新我的用户资料
      x-requires-trusted-openid: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
      responses:
        '200':
          description: 更新后的当前用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [profile]
      summary: 注销我的用户账号
      x-requires-trusted-openid: true
      responses:
        '204':
          description: 注销成功且无 response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /levels/me:
    get:
      tags: [levels]
      summary: 获取我的等级统计
      x-requires-trusted-openid: true
      responses:
        '200':
          description: 当前用户等级统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /unlocks/me:
    get:
      tags: [unlocks]
      summary: 获取我的解锁资源
      description: |
        无 query、path 或 request body 参数。成功响应使用非分页 data/request_id envelope。
        default_resources 固定按 avatar_frame、profile_card、share_card 顺序返回；unlocked 为空时返回 []。
        unlocked 按 threshold_points ASC、unlock_id ASC 稳定排序，并包含全部历史 unlock，不因当前积分隐藏。
      x-requires-trusted-openid: true
      responses:
        '200':
          description: 默认资源与已解锁记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlocksEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UnlocksUserNotFound'
        '409':
          $ref: '#/components/responses/UnlocksUserDeleted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /share-card/me:
    get:
      tags: [share-card]
      summary: 获取我的分享卡数据
      x-requires-trusted-openid: true
      parameters:
        - name: league_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LeagueId'
        - name: season_id
          in: query
          required: true
          schema:
            type: string
            enum: [2026_2027, '2026']
          description: 必须匹配 league_id 对应的当前登记赛季
        - name: round_id
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{2}$'
          description: 01 到对应 league_id 的轮次上限
      responses:
        '200':
          description: 分享卡数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCardEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /rankings:
    get:
      tags: [rankings]
      summary: 获取周榜、生涯榜、实力榜或赛季榜
      x-requires-trusted-openid: true
      description: |
        board 固定为 week、career、strength 或 season；旧 board=month 返回 422。
        该接口要求登录；游客返回 401，已注销账号返回 409。
        成功响应使用 data/request_id envelope，分页字段位于 data 内。
      parameters:
        - name: board
          in: query
          required: true
          schema:
            type: string
            enum: [week, career, strength, season]
        - name: period_key
          in: query
          required: false
          schema:
            type: string
          description: 仅 board=week 有效
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [global, group]
            default: global
        - name: group_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: scope=group 时必填，scope=global 时禁止提供
        - name: level_season_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{4}_[0-9]{4}$'
          description: 仅 board=season；群榜只允许当前赛季
        - name: limit
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Limit'
        - name: cursor
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Cursor'
      responses:
        '200':
          description: 榜单数据与可选用户排名摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RankingUserDeleted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /groups:
    post:
      tags: [groups]
      summary: 创建预测群
      x-requires-trusted-openid: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: 群创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroupEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /groups/join:
    post:
      tags: [groups]
      summary: 使用邀请码加入群
      x-requires-trusted-openid: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGroupRequest'
      responses:
        '200':
          description: 加入群成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinGroupEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /groups/{group_id}/leave:
    post:
      tags: [groups]
      summary: 离开群
      x-requires-trusted-openid: true
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 离群成功且无 response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /groups/me:
    get:
      tags: [groups]
      summary: 获取我加入的群
      x-requires-trusted-openid: true
      description: 当前用户最多加入 20 个群；按 joined_at、group_id 稳定排序分页（规范 23.2 / 23.8），limit 缺省 20，cursor 为服务端 opaque keyset 游标，无效签名返回 422 VALIDATION_ERROR。
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Limit'
        - name: cursor
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Cursor'
      responses:
        '200':
          description: 当前用户加入的群
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyGroupsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PredictionHistoryNotFound'
        '409':
          $ref: '#/components/responses/PredictionHistoryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /groups/{group_id}:
    get:
      tags: [groups]
      summary: 获取群详情
      x-requires-trusted-openid: true
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 群详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [groups]
      summary: 解散群
      x-requires-trusted-openid: true
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 群解散成功且无 response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/anomalies:
    get:
      tags: [admin]
      summary: 查询同步异常
      description: |
        成功响应按 last_seen_at DESC、anomaly_id DESC 稳定排序。
        cursor 绑定 status、blocking、last_seen_at 和 anomaly_id；客户端不得解析或构造。
        details 保留为受控空 object；内部 provider payload、密钥和运维字段不公开。
      x-requires-trusted-openid: true
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, resolved]
        - name: blocking
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Limit'
        - name: cursor
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Cursor'
      responses:
        '200':
          description: 异常分页数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnomaliesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/matches/{match_id}/result-corrections:
    post:
      tags: [admin]
      summary: 修正比赛正式赛果
      x-requires-trusted-openid: true
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResultCorrectionRequest'
      responses:
        '201':
          description: 赛果修正成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResultCorrectionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/matches/{match_id}/retry-settlement:
    post:
      tags: [admin]
      summary: 重试失败结算
      x-requires-trusted-openid: true
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyAdminRequest'
      responses:
        '200':
          description: 结算重试结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRetrySettlementEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
